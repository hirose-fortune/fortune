<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>運勢占い</title>

  <!-- Minimal, clean font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17,24,39,.10);
      --shadow: 0 18px 50px rgba(17,24,39,.08);
      --radius: 18px;
      --accent: #111827;
      --button: #111827;
      --buttonText: #ffffff;
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      background: radial-gradient(1200px 700px at 20% 0%, #ffffff 0%, var(--bg) 55%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 38px 18px 56px;
    }

    header{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1{
      font-size: 18px;
      letter-spacing: .08em;
      font-weight: 800;
      margin: 0;
      color: var(--muted);
      text-transform: uppercase;
    }

    .hint{
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .media{
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e5e7eb;
      position: relative;
    }

    .media img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content{
      padding: 22px 22px 18px;
    }

    .fortune{
      font-size: 44px;
      font-weight: 800;
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: .06em;
    }

    .msg{
      margin: 0;
      font-size: 16px;
      line-height: 1.75;
      color: #111827;
      white-space: pre-wrap; /* ← 改行をそのまま反映 */
    }

    .meta{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 22px 20px;
      border-top: 1px solid var(--border);
      background: rgba(17,24,39,.02);
    }

    button{
      appearance: none;
      border: 1px solid rgba(255,255,255,.16);
      background: var(--button);
      color: var(--buttonText);
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button:active{ transform: translateY(1px); }

    .small{
      font-size: 12px;
      color: var(--muted);
    }

    .error{
      margin-top: 10px;
      font-size: 13px;
      color: #b91c1c;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Fortune</h1>
      <p class="hint">QRで読み取るたびにランダム</p>
    </header>

    <div class="card">
      <div class="media" id="media">
        <img id="fortuneImage" alt="" />
      </div>

      <div class="content">
        <div class="fortune" id="fortune">読み込み中</div>
        <p class="msg" id="message"></p>
        <div class="error" id="error"></div>
      </div>

      <div class="meta">
        <div class="small" id="smallNote">今日もいい日になりますように。</div>
        <button id="again">もう一回ひく</button>
      </div>
    </div>
  </div>

<script>
  function pickWeighted(items){
    const list = items.filter(x => x && x.active !== false);
    if (!list.length) return null;

    const weights = list.map(x => Math.max(1, Number(x.weight || 1)));
    const total = weights.reduce((a,b)=>a+b,0);

    let r = Math.random() * total;
    for (let i=0;i<list.length;i++){
      r -= weights[i];
      if (r <= 0) return list[i];
    }
    return list[list.length-1];
  }

  function fortuneColor(f){
    // ミニマルに、ほんの少しだけトーン変える
    const map = {
      "大吉": "#b91c1c",
      "中吉": "#c2410c",
      "小吉": "#a16207",
      "吉":   "#166534",
      "末吉": "#1d4ed8",
      "凶":   "#6d28d9",
      "大凶": "#111827"
    };
    return map[f] || "#111827";
  }

  function setImage(imageUrl){
    const media = document.getElementById("media");
    const img = document.getElementById("fortuneImage");

    if (imageUrl && typeof imageUrl === "string" && imageUrl.trim().length > 0){
      img.src = imageUrl;
      img.alt = "";
      media.style.display = "block";
    } else {
      img.removeAttribute("src");
      media.style.display = "none";
    }
  }

  async function draw(){
    const err = document.getElementById("error");
    err.style.display = "none";
    err.textContent = "";

    try{
      const res = await fetch("./fortunes.json", { cache: "no-store" });
      if (!res.ok) throw new Error("fortunes.json が読み込めませんでした: " + res.status);

      const data = await res.json();
      const item = pickWeighted(data);

      if (!item) throw new Error("有効なデータがありません（active:true の行が0件）");

      const fortuneEl = document.getElementById("fortune");
      const messageEl = document.getElementById("message");

      fortuneEl.textContent = item.fortune || "---";
      fortuneEl.style.color = fortuneColor(item.fortune);

      messageEl.textContent = item.message || "";

      // 画像（fortunes.json に imageUrl があれば表示）
      setImage(item.imageUrl);

    } catch(e){
      err.style.display = "block";
      err.textContent = String(e);
    }
  }

  document.getElementById("again").addEventListener("click", draw);
  draw();
</script>
</body>
</html>
